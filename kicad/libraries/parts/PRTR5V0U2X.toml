# Nexperia PRTR5V0U2X -- dual-line ultra-low-capacitance ESD rail-clamp.
# Verified 2026-09-26 by Claude Opus 5.5 against the Nexperia datasheet
# (avionics/datasheets/prtr5v0u2x.pdf) Table 2 "Pinning information".

recommendation = "Only package offered. Protects 2 lines + VCC rail; where the VCC rail pin is not needed, a SOD-882 / DFN1006 bidirectional TVS per line (e.g. PESD5V0S1BL) is smaller but loses the rail steering -- keep PRTR on buses."

findings = [
    "Pilot TVS-CAN/TVS-RS485, Flight Engineer D_I2C, Commo ANT TVS and Observer (5x) use a SOT-363 6-pad footprint -- wrong package.",
    "Pilot, TACCO and Flight Engineer put the bus line on pin 1 and ground on pin 2; datasheet pin 1 is GND and pin 2 is I/O1.",
]
footprint_check = "stock SOT-143: pad 1 0.7 x 1.0 mm (wide GND lead b1 0.78-0.88), pads 2-4 0.7 x 0.6 -- matches SOT143B outline"

[symbol]
name = "PRTR5V0U2X"
reference = "D"
manufacturer = "Nexperia"
description = "Dual-line ESD protection, rail-to-rail clamp to VCC, SOT143B"
keywords = "ESD TVS rail clamp USB CAN RS485 I2C"
footprint = "Package_TO_SOT_SMD:SOT-143"
fp_filters = "SOT?143*"

[datasheet]
doc = "Nexperia PRTR5V0U2X product data sheet"
url = "https://assets.nexperia.com/documents/data-sheet/PRTR5V0U2X.pdf"
section = "Table 2 (pinning), Sec. 11 package outline SOT143B"

[[packages]]
code = "SOT143B"
pins = 4
body = "2.9 x 1.3 mm"

[pins]
left = ["2 IO1 P", "3 IO2 P"]
top = ["4 VCC P"]
bottom = ["1 GND P"]
