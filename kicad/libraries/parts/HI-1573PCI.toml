# Holt HI-1573 3.3 V MIL-STD-1553 dual transceiver, 44-pin QFN 7x7.
# Verified 2026-09-26 (Claude Opus 5.5) against hi-1573.pdf (DS1573 Rev U)
# p.1 Pin Configurations; heat sink is electrically isolated.
recommendation = "44-pin 7x7 QFN is the smallest of the three packages offered (20-pin ESOIC-WB 12.8 x 10.3 mm, 20-pin ceramic DIP)."
findings = ["Pilot/TACCO copies type the exposed pad power_in; datasheet says the heat sink is electrically isolated -> passive."]
footprint_check = "stock QFN-44 7x7 P0.5 EP-land 5.2 mm under a 5.50 mm isolated heat sink -- land smaller than EP is accepted practice, keeps ~0.5 mm to lead toes"

