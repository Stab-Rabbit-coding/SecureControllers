# Tables 11-13 and Fig. 1 (EP 3.6 +/-0.1 mm, internally GND, Sec. 2.1.2).
recommendation = "Single package (PG-UQFN-32, 5x5 mm). Prefer the AU2.0 ordering code (-40..105 C) over XU2.0 (-40..85 C) for an aircraft; pin-identical, so this one symbol covers both via the MPN field."
findings = ["Commo footprint uses EP3.45x3.45 -- datasheet EP is 3.6 x 3.6 mm.", "Gateway/Observer copy lists pin 10 as NCI; datasheet Table 13 is NCI/VDD."]
footprint_check = "stock QFN-32 5x5 P0.5, EP land 3.6 x 3.6 = package EP 3.6 +/-0.1 (Fig. 1)"

