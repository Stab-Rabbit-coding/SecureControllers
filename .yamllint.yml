# yamllint config — see https://yamllint.readthedocs.io/en/stable/configuration.html
# Mirrors the sibling-repo config (Open-Secure-ESC) for consistency.
extends: default

rules:
  line-length:
    max: 120
    level: warning
  document-start: disable
  truthy:
    allowed-values: ["true", "false", "on"]
