name: KiCad boards

# NoNFO-Pilot-PB2: pin ledgers (header and MCU), the generated schematic and its
# ledger-match tests (Python job), KiCad 9.0.2 ERC on the generated sheet (S36), and
# DRC on the five isolation cells with the moat negative control (S37).

on:
  push:
    branches: [initial, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kicad-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pin-ledger:
    name: NoNFO-Pilot-PB2 pin ledgers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install pytest
        run: pip install pytest

      - name: Header ledger, option B+ (owner decision OD-18)
        run: python3 kicad/NoNFO-Pilot/PB2/pin_ledger/pin_ledger.py --require B+

      - name: MCU ledger, MSPM0G3519-Q1 RGZ-48
        run: python3 kicad/NoNFO-Pilot/PB2/pin_ledger/mcu_ledger.py

      - name: Schematic is up to date with its generator
        run: |
          python3 kicad/NoNFO-Pilot/PB2/scripts/gen_nonfo_pb2_sch.py
          git diff --exit-code -- kicad/NoNFO-Pilot/PB2/kicads

      - name: Ledger, parts and schematic tests
        run: python3 -m pytest -q kicad/NoNFO-Pilot/PB2/tests

  erc:
    name: NoNFO-Pilot-PB2 ERC (KiCad 9.0.2)
    runs-on: ubuntu-latest
    container:
      image: kicad/kicad:9.0.2
      options: --user root
    steps:
      - uses: actions/checkout@v4

      # Serenity-UAV's footprint library is not checked out here, so footprint-link
      # warnings are expected in CI; any ERC error fails the job.
      - name: ERC, errors fail the job
        run: >
          kicad-cli sch erc --severity-error --exit-code-violations
          -o erc.rpt kicad/NoNFO-Pilot/PB2/kicads/NoNFO-Pilot-PB2.kicad_sch

      - name: Full ERC report
        if: always()
        run: |
          kicad-cli sch erc --severity-all -o erc-all.rpt kicad/NoNFO-Pilot/PB2/kicads/NoNFO-Pilot-PB2.kicad_sch || true
          cat erc-all.rpt

  cell-drc:
    name: NoNFO-Pilot-PB2 isolation cells DRC (KiCad 9.0.2)
    runs-on: ubuntu-latest
    container:
      image: kicad/kicad:9.0.2
      options: --user root
    steps:
      - uses: actions/checkout@v4

      # Each cell: DRC errors 0 and unconnected 0; then a copy with one track drawn
      # across the moat must be caught (negative control).
      - name: Isolation cells, DRC and moat negative control
        run: python3 kicad/NoNFO-Pilot/PB2/scripts/check_iso_cells.py
