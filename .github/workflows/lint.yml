name: Lint

# Mirrors the lint.yml pattern already used in the sibling repos that
# consume this library (Open-Secure-ESC, open-servo-core-secure,
# LibreServo_v4) so SecureControllers holds the same linting bar as the
# repos that pull hardware assets from it.

on:
  push:
    branches: [initial, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lint-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  markdown:
    name: Markdown lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install markdownlint-cli2
        run: npm install -g markdownlint-cli2

      - name: Run markdownlint-cli2
        run: markdownlint-cli2 "**/*.md"

  yaml:
    name: YAML lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install yamllint
        run: pip install yamllint

      - name: Run yamllint
        run: yamllint --config-file .yamllint.yml .

  actions:
    name: GitHub Actions lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run actionlint
        run: |
          bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
          ./actionlint -color

  python:
    name: Python lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Check for Python sources
        id: pyfiles
        # Scoped to tools/ only: kicad/*.py, kicad/<Board>/scripts/*.py, and
        # firmware/fc/tools/*.py are pre-existing per-board PCB generator
        # scripts predating this CI (271 ruff findings on first run) that
        # the project's own convention treats as drift-prone and not safe
        # to regenerate/reformat opportunistically (see
        # feedback_generator_drift_and_freerouting: "never re-run PCB gen
        # after manual packing" — an import-sort or format pass is exactly
        # that kind of unreviewed touch). tools/ is this effort's own new
        # code and starts fully lint-clean.
        run: |
          if git ls-files -- 'tools/*.py' | grep -q .; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "No Python files under tools/ yet — nothing to lint."
          fi

      - name: Install ruff
        if: steps.pyfiles.outputs.found == 'true'
        run: pip install ruff

      - name: Ruff check
        if: steps.pyfiles.outputs.found == 'true'
        run: ruff check tools/

      - name: Ruff format check
        if: steps.pyfiles.outputs.found == 'true'
        run: ruff format --check tools/

  whitespace:
    name: Repo hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: No trailing whitespace
        run: |
          # Two trailing spaces is a deliberate Markdown hard-line-break, not
          # accidental whitespace — .md is excluded here for that reason.
          # KiCad S-expression files (.kicad_sch/.kicad_pcb/.kicad_sym/
          # .kicad_mod) are tool-generated and not hand-edited for style.
          # shellcheck disable=SC2016
          if git grep -In ' $' -- . \
              ':!*.pdf' ':!*.step' ':!*.stp' ':!*.wrl' ':!*.stl' \
              ':!*.xlsx' ':!*.png' ':!*.jpg' ':!*.md' \
              ':!*.kicad_sch' ':!*.kicad_pcb' ':!*.kicad_sym' ':!*.kicad_mod'; then
            echo "::error::Trailing whitespace found (see lines above)."
            exit 1
          fi

      - name: Files end with a trailing newline
        run: |
          status=0
          while IFS= read -r -d '' f; do
            [ -s "$f" ] || continue
            if [ -n "$(tail -c1 "$f")" ]; then
              echo "::error file=$f::Missing trailing newline"
              status=1
            fi
          done < <(git ls-files -z -- '*.md' '*.py' '*.yml' '*.yaml' '*.sh')
          exit $status

      - name: No merge-conflict markers
        run: |
          if git grep -InE '^(<<<<<<<|=======|>>>>>>>)( |$)' -- . ':!*.pdf'; then
            echo "::error::Unresolved merge-conflict markers found."
            exit 1
          fi
